services:

  backend:
    build: ./backend

    container_name: sangama-backend

    restart: always

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend

    container_name: sangama-frontend

    restart: always

    ports:
      - "3000:80"

    depends_on:
      - backend
